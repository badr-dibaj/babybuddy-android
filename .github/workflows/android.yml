name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: |
          sdkmanager --install "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> $GITHUB_ENV
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Rust .so
        run: |
          cargo ndk -t aarch64-linux-android -t armv7-linux-androideabi -t x86_64-linux-android \
            -o android/app/src/main/jniLibs build --package babybuddy --features android --release
      - name: Assemble APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: babybuddy-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
