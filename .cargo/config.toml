# ─── Android Cross-Compilation Configuration ─────────────────────────────────
#
# Prerequisites:
#   1. Install Android NDK r25+ (or latest LTS)
#   2. Set ANDROID_NDK_HOME in your environment, e.g.:
#        export ANDROID_NDK_HOME=$HOME/Android/Sdk/ndk/25.2.9519653
#   3. Install Rust Android targets:
#        rustup target add aarch64-linux-android
#        rustup target add armv7-linux-androideabi
#        rustup target add x86_64-linux-android
#        rustup target add i686-linux-android
#
# NOTE: The `ar` entries have been intentionally omitted.
# Cargo does NOT expand shell variables like ${ANDROID_NDK_HOME} in config.toml,
# so a literal "${ANDROID_NDK_HOME}/..." path would cause archiver failures
# (especially with LTO). cargo-ndk sets AR_* env vars that are picked up
# automatically by the cc crate and by cargo's own archiver lookup.
# The linker entries below are used for local builds only — in CI, cargo-ndk
# overrides them via CARGO_TARGET_*_LINKER environment variables.

[target.aarch64-linux-android]
linker = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"

[target.armv7-linux-androideabi]
linker = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi29-clang"

[target.x86_64-linux-android]
linker = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android29-clang"

[target.i686-linux-android]
linker = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android29-clang"

# ─── macOS variant (Apple Silicon host) ──────────────────────────────────────
